rule_sha256 = "0d5173d0f79ac6b0d265e3369542a70ae7a4b80e0dd00456d8184bb407a4a114"

# --- Messages a person reads

[rule.016ceef1ef2547f8aa157cb7eb3157cc]  # Confirm project switches
when = [{ fact = "actor.interactive", eq = true }]
note = "Needs a person conversing with the actor."
rule_sha256 = "f78e64c8e6794b5954ea54c987c298364cbbb1c9979788d7f84a92716541d770"

[rule.de5f1d0582294f77b597b1a5b42c9d76]  # Outcome-first reports
when = [{ fact = "actor.interactive", eq = true }]
note = "\"A message to the user\": actor.interactive means a person reads this actor's messages."
rule_sha256 = "e9c749a2dedfa0d2861a05eb97d51f2550a0c8a68bba5290bd59305b695c3679"

[rule.718e79f5b3fa40249cb178139c26b28f]  # Resolvable user-facing paths
when = [{ fact = "actor.interactive", eq = true }]
note = "\"A path you show the user\"."
rule_sha256 = "2dd74124cd72aa8bf869d60bf8d25bacc9f89cc7932ca0e32c8850894b7812ae"

[rule.65fcb49d5d7344d9a052800af708b9ee]  # Self-explanatory image sheets
when = [{ fact = "actor.interactive", eq = true }]
note = "\"A sheet of images you hand the user to judge\"."
rule_sha256 = "6febfe6df38f60c74cca50235a65c11bd5c55b4db8712ca0920d768525dd8759"

[rule.fb8d914a2eb44a64acc7e086970328a0]  # Report evidence and limits
any = [
  { when = [{ fact = "actor.interactive", eq = true }] },
  { governs = ["task-records"] },
]
note = "Messages to the user, and what goes in task notes and linked records instead; the second alternative keeps it for an unread actor that writes task records."
rule_sha256 = "6a4f165bf831d9a52aa03b8663845df7959b330092f81427a4a0aa5a154fdd2f"

[rule.19c566200a204b339abf808f84984c7d]  # Retain rulings and integration state
any = [
  { when = [{ fact = "actor.interactive", eq = true }] },
  { governs = ["task-records"] },
]
note = "Message against record, done and park notes and the plan ledger; the second alternative keeps it for an unread controller that writes task records."
rule_sha256 = "51427f1d9c170fbe161cf040da68f0b539efd85ce8b10a99e72fcc1d4d54b16d"

# --- Target checkout

[rule.b7fe2b6f29a046a283cd91afb240c723]  # Apply the code organization checklist in implementation and review briefs
when = [{ fact = "target.code_guide", eq = true }]
note = "\"When a target or reviewed repository's root AGENTS.md cites a code guide\"."
rule_sha256 = "aac4d32729b440411c74e34f9d9c15b63bb3d0c1f5d85536074fed28a9d23e63"

[rule.48ef50fb32d24e7fa13b92a69affc29b]  # Full-suite route
when = [{ fact = "target.test_policy", in = ["broad"] }]
note = "\"Under effective broad policy\"."
rule_sha256 = "497ad91fafc7f08460f41bea3fe901461eaeb57c43260259e0bdd2bc63d7ed25"

[rule.da431a1b3ac14c21800cb5488031d7e8]  # Use the test front door
when = [{ fact = "target.test_front_door", eq = true }]
note = "\"In a project with the test front door (a justfile with test-fast)\"."
rule_sha256 = "84c400f1f675a17cd529a87a5c5c80b051ef6b8e6f63f9eb61319ea26da289b6"

[rule.6d4b70ba6bee49de980520cbdeab198e]  # Cap local test and build fan-out with host-budget
when = [{ fact = "host.host_budget", eq = true }]
note = "\"Where host-budget is installed\"."
rule_sha256 = "fc6893129d550b7b24a709f1d2479f15376432193e4874ac6ffd8d39eea56072"

# --- Actor mechanics

[rule.5b1c2e9a734c498fb8285b1eb1cba9cf]  # Shell syntax boundaries
when = [{ fact = "actor.shell", in = ["zsh"] }]
note = "\"Under zsh\": the bash sentence only explains which harness runs which shell."
rule_sha256 = "d920966d471bc5e38df5578a41ef495d895dda669d94b082aa786607ce075d7c"

[rule.0472de81465f41dcb870eec7f86bfa47]  # Read complete skill text
when = [{ fact = "actor.skills", in = ["shell"] }]
note = "\"A skill read through the shell rather than loaded natively\"."
rule_sha256 = "338361491033fa50eebd496e47b5d675c812b64ae704f7348ae9d84f8e5e2c4b"

# --- Lead-ins

[rule.986dd690d14b42a1a7ca315e475ff7c2]  # Record machine-readable outcomes
