# Applicability of delivered rules (docs/context-selection.md).
# A rule with no entry is always selected. Entries here are proposed until the user approves
# them; `lore context approve` writes their `reviewed` digests. Rules that were considered and
# left without an entry are listed in the commit that proposed this file.

# --- Worktrees

[rule.3278f93fcc9342819ee39d1bc5ba318f]  # Isolated worktrees and setup
governs = ["worktree-lifecycle"]
by = "first-edit"
note = "worktree-lifecycle here means the whole worktree setup an actor may be spared: creating it, hydrating it, reporting a missing setup route, preparing its baseline, and removing it; band's launcher does all of these before its worker starts. The obligation to change code only inside a worktree is met by the launcher placing the worker in one."
rule_sha256 = "9b96b98296f8fa2d9a579a816c372958586ffb6d5b32630cb3513e8370b2f921"

[rule.813cfae03116426f9b5da22b5af1cf83]  # Preserve ignored files before removal
governs = ["worktree-lifecycle"]
note = "Every obligation is a step of removing a worktree."
rule_sha256 = "a96818cd4d091db57fef39c6c935702222bdb7e12e039476b2f449fcca019da4"

[rule.eadfc260a2134d269009cae210212fdf]  # Submodule worktree removal
governs = ["worktree-lifecycle"]
note = "Every obligation is a step of forcing a worktree removal."
rule_sha256 = "4cf0ae497cbfcddac72c3c8e245fb55dcb4efacab869bf68545d6d241d970933"

[rule.4402e5c1ec654514a43ca011c2800ba6]  # Harvest timings before removal
governs = ["worktree-lifecycle"]
note = "\"Before removing a worktree\": removal only."
rule_sha256 = "5b5fe45de2ef010f24d13133cbed05523533e3940139db3f9a00bd885b81c74f"

# --- Asking the user

[rule.2c5785f136ca4ee590e1c69406276623]  # Question format
governs = ["ask-user"]
note = "\"A question, when asked\": every clause is about how to ask the user."
rule_sha256 = "84fa24acfd1d9e6dfd2d6a4f8d2f8fcd2aae031866d06b1d396f3eaff246c210"

# --- Integration

[rule.5a5808d0572f49e49afe103d7569231e]  # Local integration and external actions
governs = ["integrate"]
note = "Local merge, push, PR: the integrate duty."
rule_sha256 = "d1a9938f2e4eb5688878c7a8dfd60d7deea84bbb88402402fd8c9b913a8a852c"

# --- Task records

[rule.e5201d5768794401bf9d88a39b1ee445]  # Reopen unfinished review corrections
governs = ["task-records"]
note = "tasks edit, start, done, park and filing a concerns task: task record writes."
rule_sha256 = "9ce030598b9fcf8b9d373c93eb72cf694b9fd601611f00c71e5d9f0e2b67fc9a"

[rule.019b1ebc42524f6689c223c58ca6cadf]  # Deferred findings have an open owner before close
governs = ["task-records"]
note = "\"Before tasks done\": filing follow-ups and noting tasks."
rule_sha256 = "64c8b6416fa84c9c230c66ea35473055ee488dc6d5f4fb8dd112b9c8a415d6e8"

[rule.13f54add0c144229bf870b4b39835acf]  # Halt tasks take priority
governs = ["task-records"]
note = "Choosing and starting a task, forcing or parking it: claiming is a task record write."
rule_sha256 = "631f7b9abd60c342343272b6c72b955786e4ced731c29bdaa94849ded0a50bb4"

[rule.86172e9df3bc47369bde0a298b8a292a]  # Record concerns at filing
governs = ["task-records"]
note = "\"When you file a task\": filing and noting."
rule_sha256 = "1372732082081c85558485b6ce6f5dbfd96caa9d2008e94a4e38601ec234ac0e"

[rule.b6576b5590d4430da697c160e083b10c]  # Latency incident verification
governs = ["task-records"]
note = "Retiring obligations, removing halts, tasks start, attach and done on incident tasks; the advisory clauses impose nothing on an actor that cannot touch incidents."
rule_sha256 = "eaebafc1e1e9daf7ee31c190c5cd394a3cceb8e839128d1811f806f3d2b21f30"

# --- Trials

[rule.b2d5d7b434c74989a11e2b7a88dcd829]  # Honor trial assignments
governs = ["trials"]
note = "\"After tasks start, run trial-arm\": the trials duty."
rule_sha256 = "8b278d29640abdeef040b6272c02b3c9935cf2eec9a12c8ad5691c6cdc5509f9"

# --- Review rounds

[rule.00bc708d91bf4a1b80ce498d206479e4]  # Assign independent reviewer effort through native settings
governs = ["run-reviews"]
note = "Drawing effort, launching reviewers and keeping assignments: running review rounds."
rule_sha256 = "71ef391cee22f02915ffdeeacadb4743e5cea36219e7b36168686ccc11f0230d"

[rule.6e47fe41e61e4fa4a39e084d05e7a8a1]  # Brief reviewers and record rubric regimes
governs = ["run-reviews", "dispatch"]
note = "\"Every brief\" may be read as every dispatch brief, not only a reviewer's, so dispatch is governed too; review regime notes belong to whoever runs the review."
rule_sha256 = "eede5669b6d03e8b73dcf2154297cf1ff29d8e45da67c9fcdb7411d74e1be9cf"

[rule.046dfb8c365f454a86390b6b4167e487]  # Read-only reviewers and saved reports
any = [
  { when = [{ fact = "actor.role", in = ["reviewer"] }] },
  { governs = ["run-reviews"] },
]
note = "Binds the reviewer (its role) and the controller that dispatches it and checks its report (run-reviews)."
rule_sha256 = "1496d212378747e8c0ab9ca9dc40ecd9856ea8022fca941b0d94d0620996d4b4"

