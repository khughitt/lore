# The locked test environment. lore is not a package: its tools run on the system
# python3 and import only the standard library. This declares the test runner alone,
# pinned in uv.lock and installed into .venv by `just setup`.
[project]
name = "lore"
version = "0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=9", "pytest-xdist>=3.6"]

[tool.uv]
package = false
# Test on the interpreter the assembler and hooks run on, not a uv-managed one.
python-preference = "only-system"
